<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Creatura — a local-first visual story bible, timeline mapper and minimalist writing studio for authors." />
    <meta name="theme-color" content="#22242A" />
    <!-- %BASE_URL% resolves against Vite's `base` so the icon still loads when served from a subpath (GitHub Pages). -->
    <link rel="icon" href="%BASE_URL%quill.svg" type="image/svg+xml" />
    <!-- Fonts are bundled with the app (see src/styles/index.css) rather than
         loaded from Google Fonts here, so they render reliably regardless of
         network restrictions or ad/privacy blockers. -->
    <title>Creatura</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('creatura.theme');
          var mode = raw || 'dark';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable — keep the default dark class */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
